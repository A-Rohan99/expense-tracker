# Render Blueprint — one-click backend + Postgres.
#
# In the Render dashboard: New -> Blueprint -> pick this repo. Render reads
# this file, provisions the database, and deploys the API. Every push to
# main after that redeploys automatically; no extra CI step needed.
databases:
  - name: expense-tracker-db
    plan: free
    databaseName: expense_tracker
    user: expense_tracker

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://a-rohan99.github.io"
