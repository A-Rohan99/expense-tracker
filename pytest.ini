[pytest]
testpaths = tests
# `app` lives at the repo root, not on sys.path unless pytest puts it there —
# `python -m pytest` does this for free, a bare `pytest` invocation (what CI
# and most editors run) does not.
pythonpath = .
# Quiet, readable failures; -ra summarises anything non-passing at the end.
addopts = -ra --strict-markers
filterwarnings =
    error::DeprecationWarning:app.*
